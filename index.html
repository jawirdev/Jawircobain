
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawir Tools - Gemini Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e3e3e3;
            margin: 0;
            padding: 0;
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes shiny {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .text-shiny {
            background: linear-gradient(90deg, #4285f4, #9b72cb, #4285f4);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shiny 4s linear infinite;
        }
        .gemini-gradient {
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.1) 0%, rgba(155, 114, 203, 0.1) 100%);
        }
    </style>
